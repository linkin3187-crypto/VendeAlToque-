<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Merkap se mudó a merkap.com.co</title>
<!-- Merkap · Fase B · Redirección del enlace viejo (github.io) al dominio nuevo.
     Se usa como index.html Y como 404.html del repositorio público «VendeAlToque-»:
     cualquier dirección vieja (anuncio, tienda, QR) se manda a la MISMA página en merkap.com.co,
     con todo lo que va después del «?» y del «#». -->
<script>
  (function () {
    var DOMINIO = "https://merkap.com.co";
    var ruta = location.pathname.replace(/^\/VendeAlToque-(\/|$)/i, "/");
    if (ruta === "" ) ruta = "/";
    location.replace(DOMINIO + ruta + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="2; url=https://merkap.com.co/">
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eef2ff; color: #1e1b4b;
         display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  a { color: #4338ca; font-weight: 800; }
</style>
</head>
<body>
  <p>Merkap se mudó a <a href="https://merkap.com.co/">merkap.com.co</a>.<br>Te estamos llevando…</p>
</body>
</html>
